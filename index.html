<!DOCTYPE html>
<html>
<head>
    <title>Happy Valentine's Day!</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background-color: #ffe6f0;
            margin: 0;
            overflow: hidden;
        }

        h1 {
            margin-top: 100px;
            font-size: 3rem;
            color: #d63384;
        }

        p {
            font-size: 1.5rem;
            margin-top: 20px;
            color: #b03060;
        }

        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            margin: 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #guessBtn {
            background-color: #ff4d6d;
            color: white;
        }

        #noGuessBtn {
            background-color: #6c757d;
            color: white;
        }

        /* Floating hearts */
        .heart {
            position: absolute;
            bottom: -50px;
            font-size: 24px;
            animation: floatUp 6s linear infinite;
            opacity: 0.8;
        }

        @keyframes floatUp {
            from { transform: translateY(0); opacity: 0.8; }
            to { transform: translateY(-110vh); opacity: 0; }
        }
    </style>
</head>
<body>

    <h1>Happy Valentine's Day! 💖</h1>
    <p id="subtext">Guess what I did this time?</p>

    <button id="guessBtn">Ok I guess I'll guess 😌</button>
    <button id="noGuessBtn">No I don’t wanna guess 🙄</button>

<script>
    const guessBtn = document.getElementById("guessBtn");
    const noGuessBtn = document.getElementById("noGuessBtn");
    const subtext = document.getElementById("subtext");

    guessBtn.addEventListener("click", function() {
        document.body.innerHTML = `
            <h1 id="hint" style="margin-top:100px;color:#d63384;">
                Hint (starts with C and ends with t)
            </h1>

            <input id="guessInput" type="text" maxlength="9"
                placeholder="Enter 9-letter word"
                style="padding:10px;font-size:1.2rem;border-radius:8px;border:none;margin-top:20px;">
            <br>

            <button id="submitGuess"
                style="margin-top:20px;padding:10px 20px;font-size:1rem;border:none;border-radius:8px;background:#ff4d6d;color:white;cursor:pointer;">
                Submit
            </button>

            <p id="response" style="margin-top:20px;font-size:1.2rem;color:#b03060;"></p>
        `;

        const submitBtn = document.getElementById("submitGuess");
        const input = document.getElementById("guessInput");
        const response = document.getElementById("response");
        const hint = document.getElementById("hint");

        let wrongAttempts = 0;

        submitBtn.addEventListener("click", function() {
            const value = input.value.trim().toLowerCase();

            if (value === "cyberhunt") {

            // 30% chance to go to cheater page
            if (Math.random() < 0.3) {
                window.location.href = "cheater.html";
            } else {
                window.location.href = "gifts.html";
            }

            return;
            }




            wrongAttempts++;

            if (wrongAttempts === 1) {
                hint.innerText = "Hint (starts with cy and ends with nt)";
                response.innerText = "Nope… try again 😌";
            }
            else if (wrongAttempts === 2) {
                hint.innerText = "Hint (starts with cyb and ends with unt)";
                response.innerText = "Still not it 👀";
            }
            else if (wrongAttempts >= 3) {
    hint.innerText = "really girl? the word is cyberhunt smh 🤦‍♂️";
    response.innerText = "";

    input.disabled = true;
    submitBtn.disabled = true;

    // Redirect to gifts page
    setTimeout(function() {
        window.location.href = "gifts.html";
    }, 3000);
}

        });
    });

    noGuessBtn.addEventListener("click", function() {
        subtext.innerText = "Too bad… you’re guessing anyway 😌💕";
    });

    // Floating hearts generator
    function createHeart() {
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerHTML = "💖";
        heart.style.left = Math.random() * window.innerWidth + "px";
        heart.style.fontSize = (20 + Math.random() * 30) + "px";
        heart.style.animationDuration = (4 + Math.random() * 3) + "s";
        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 6000);
    }

    setInterval(createHeart, 500);
</script>

</body>
</html>
