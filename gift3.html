<!DOCTYPE html>
<html>
<head>
    <title>Gift 3 🎁</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background-color: #ffe6f0;
            margin: 0;
            padding-top: 120px;
        }

        h1 {
            color: #d63384;
            font-size: 2.5rem;
        }

        input {
            margin-top: 40px;
            padding: 15px;
            width: 60%;
            font-size: 1.2rem;
            border-radius: 10px;
            border: 2px solid #ff4d6d;
            text-align: center;
        }

        button {
            margin-top: 20px;
            padding: 12px 30px;
            font-size: 1.2rem;
            border: none;
            border-radius: 10px;
            background-color: #ff4d6d;
            color: white;
            cursor: pointer;
            transition: 0.3s ease;
        }

        button:hover {
            transform: scale(1.05);
        }

        /* Bottom-right Wordle link */
        .wordleLink {
            position: fixed;
            bottom: 20px;
            right: 20px;
            font-size: 0.9rem;
            color: #d63384;
            text-decoration: none;
        }

        .wordleLink:hover {
            text-decoration: underline;
        }

        .error {
            color: red;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <h1>Crack the code 🔐</h1>

    <input type="text" id="answer" placeholder="Enter the full sentence...">

    <br>
    <button onclick="checkAnswer()">Submit</button>

    <p class="error" id="errorMessage"></p>

    <!-- Wordle hint link -->
    <a class="wordleLink" href="https://mywordle.strivemath.com/?word=wrfup" target="_blank">
        The Missing Piece
    </a>

    <script>
        function checkAnswer() {
    let input = document.getElementById("answer").value.trim().toLowerCase();

    let correct = "my love i adore you so i wrote you this";

    if (input === correct) {
        window.location.href = "final.html";
    } else {
        document.getElementById("errorMessage").innerText = 
            "Hmm... something is missing 💭";
    }
}

    </script>

</body>
</html>
